services:
  roadbook:
    build: ..
    restart: unless-stopped
    env_file: runtime.env
    volumes:
      - roadbook-private:/app/.automation/travel-private
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: runtime.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      roadbook:
        condition: service_healthy
volumes:
  roadbook-private:
  caddy-data:
  caddy-config:
